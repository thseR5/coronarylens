# Registered models. Adding a model = one class implementing the PatternModel protocol in
# ml/models.py + one entry here. `served` is the model the API loads.

seed: 42

served: procedure        # Part 2 sprint: the validated selection procedure (docs/EXPERIMENTS.md); was joint_ensemble

validation:                    # benchmark CV in ml/train.py (5x5); the served procedure's headline is the 10x5 sprint run
  test_fraction: 0.20          # locked, stratified on vessel pattern
  outer_folds: 5
  outer_repeats: 5
  inner_folds: 3
  bootstrap_ci_resamples: 2000
  uncertainty_bootstrap_models: 50

pattern_models:
  joint_ensemble:
    kind: joint                 # one 8-class model over vessel patterns
    members:
      - {name: logreg, cls: ElasticNetLogReg, params: {C: 0.3, l1_ratio: 0.5}, weight: 1.0}
      - {name: rf, cls: RandomForest, params: {n_estimators: 500, min_samples_leaf: 3, max_features: sqrt}, weight: 1.0}
      - {name: et, cls: ExtraTrees, params: {n_estimators: 500, min_samples_leaf: 3, max_features: sqrt}, weight: 1.0}
    calibration: vector         # benchmark CV chose vector (metrics.json cv.selection); served model: served_procedure

benchmarks:
  independent_ensemble:
    kind: independent           # one binary ensemble per target (CAD, LAD, LCX, RCA)
    members: [logreg, rf, et]
  regularized_logreg:
    kind: independent           # four separate elastic-net LRs (same settings as the joint model's LR member)
    members: [logreg]
  naive_logreg:
    kind: independent           # four separate default logistic regressions: the typical baseline
    members:
      - {name: naive_lr, cls: LogReg, params: {C: 1.0}, weight: 1.0}
  classifier_chains:
    kind: chain                 # ensemble of chains, random vessel orders, OOF probabilities
    n_chains: 6
  lightgbm:
    kind: joint
    members:
      - {name: lgbm, cls: LightGBM, params: {n_estimators: 300, learning_rate: 0.03, num_leaves: 7, min_child_samples: 10, subsample: 0.8, colsample_bytree: 0.8}, weight: 1.0}

# Served procedure (Part 2 sprint). On the training split, the same inner selection that the 10x5 nested CV validated
# (inner 5-fold OOF, cross-fitted post-processing, lowest pattern log-loss) picks one of these finalists; learner
# specs live in ml/sprint/screen.py SPECS. The finalist list is the output of the pre-registered rule
# (ml/sprint/finalists.py, reports/sprint/finalists.json); the last entry is the previous served recipe.
served_procedure:
  inner_folds: 5
  bootstrap_overrides: {}       # bootstrap members use the served hyperparameters (judge review 2026-10-13)
  candidates:
    - {"learners": ["catboost_d3", "sel_joint", "svm"], "combine": "avg", "calib": "dirichlet"}
    - {"learners": ["ebm", "bayes_lr", "sel_joint"], "combine": "avg", "calib": "dirichlet"}
    - {"learners": ["catboost_d3", "bayes_lr", "sel_joint"], "combine": "avg", "calib": "dirichlet"}
    - {"learners": ["catboost_d3", "sel_joint", "svm"], "combine": "avg", "calib": "vector"}
    - {"learners": ["catboost", "bayes_lr", "sel_joint"], "combine": "avg", "calib": "dirichlet"}
    - {"learners": ["catboost", "sel_joint", "svm"], "combine": "avg", "calib": "dirichlet"}
    - {"learners": ["catboost", "sel_joint", "svm"], "combine": "avg", "calib": "vector"}
    - {"learners": ["catboost", "svm"], "combine": "avg", "calib": "vector"}
    - {"learners": ["catboost", "catboost_d3", "svm"], "combine": "avg", "calib": "vector"}
    - {"learners": ["lr_en", "rf", "et"], "combine": "avg", "calib": "vector"}
